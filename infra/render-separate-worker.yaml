# OPTIONAL paid worker layout. Do not apply for the default free demonstration.
# This keeps an API and a separately billed persistent worker.
services:
  - type: web
    name: practice-assistant-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    dockerCommand: /app/infra/start.sh api
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
  - type: worker
    name: practice-assistant-worker
    runtime: docker
    region: oregon
    plan: 0.5c-512mb
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    dockerCommand: /app/infra/start.sh worker
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromService:
          type: web
          name: practice-assistant-api
          envVarKey: DATABASE_URL
      - key: SUPABASE_URL
        fromService:
          type: web
          name: practice-assistant-api
          envVarKey: SUPABASE_URL
      - key: SUPABASE_ANON_KEY
        fromService:
          type: web
          name: practice-assistant-api
          envVarKey: SUPABASE_ANON_KEY
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService:
          type: web
          name: practice-assistant-api
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
      - key: OPENROUTER_API_KEY
        fromService:
          type: web
          name: practice-assistant-api
          envVarKey: OPENROUTER_API_KEY
      - key: ENVIRONMENT
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
