# Default free demonstration: supervised API and worker processes in one web service.
# Both processes sleep when Render spins down the free instance; state stays in Supabase.
# Optional separately billed worker layout: infra/render-separate-worker.yaml.
services:
  - type: web
    name: practice-assistant-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    dockerCommand: /app/infra/start.sh demo
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
