# Local CLI configuration for this dedicated demonstration project.
# Hosted migrations are applied by services.assistant.migrate.
project_id = "practice-assistant"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
enable_signup = true
enable_anonymous_sign_ins = true

[storage]
enabled = true
file_size_limit = "10MiB"
