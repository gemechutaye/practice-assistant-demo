[project]
name = "practice-assistant"
version = "0.1.0"
description = "An independent physician-workflow demonstration with verified actions."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1", "pydantic>=2.11,<3",
  "httpx>=0.28,<1", "psycopg[binary,pool]>=3.2,<4", "python-dotenv>=1.1,<2",
  "python-multipart>=0.0.20,<1", "PyJWT[crypto]>=2.10,<3",
  "langgraph>=0.6,<2", "langgraph-checkpoint-postgres>=2,<4",
  "opentelemetry-api>=1.36,<2", "opentelemetry-sdk>=1.36,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2", "mcp>=1.13,<2"
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
